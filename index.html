        @keyframes pulse-bar { 0%, 100% { height: 6px; } 50% { height: 18px; } }

        const DEFAULT_PASSAGES = [
            {
                id: 'p4_1', 
                title: 'P4-1',
                sentences: [
                    { id: 's4_1_1', text: "After talking to Grandpa, Cindy asked her uncle for help." },
                    { id: 's4_1_2', text: "For the next four weeks, Cindy ran at the park with her uncle." },
                    { id: 's4_1_3', text: "Every day, she became fitter than the day before." },

                    { id: 's4_1_10', text: "Grandpa was cheering and clapping his hands next to the finishing line." },
                    { id: 's4_1_11', text: "\"Well done, Cindy!\" Grandpa hugged Cindy." },
                    { id: 's4_1_12', text: "\"It's all thanks to you, Grandpa! I'm so happy to see you here,\" Cindy smiled." }
                ]
            },
            {
                id: 'p4_partA',
                title: 'P4-PartA',
                sentences: [
                    { id: 's4_pA_1', text: "Computer Studies" },
                    { id: 's4_pA_2', text: "General Studies" },
                    { id: 's4_pA_3', text: "Visual Arts" },
                    { id: 's4_pA_4', text: "interesting" },
                    { id: 's4_pA_5', text: "Assembly" },
                    { id: 's4_pA_6', text: "Recess" },
                    { id: 's4_pA_7', text: "Chinese" },
                    { id: 's4_pA_8', text: "challenging" }
                ]
            }
        ];

        const PUNCTUATION_MAP = {
            '.': 'full stop',
            ',': 'comma',
            '?': 'question mark',
            '!': 'exclamation mark',
            ';': 'semicolon',
            ':': 'colon'
        };

        const tokenizeWords = (text, speakPunct) => {
            const tokens = [];
            const regex = /([a-zA-Z0-9']+)|([.,!?;:])/g;
            let match;
            while ((match = regex.exec(text)) !== null) {
                if (match[1]) {
                    tokens.push({ text: match[1] });
                } else if (match[2] && speakPunct) {
                    const pName = PUNCTUATION_MAP[match[2]];
                    if (pName) {
                        tokens.push({ text: pName });
                    }
                }
            }
            return tokens;
        };

        const parseTextForSpeech = (text, speakPunctuation) => {
            if (!speakPunctuation) {
                return [{ phrase: text, punctWord: null, rawPunct: null }];
            }
            const regex = /([.,!?;:])/g;
            const parts = text.split(regex);
            let segments = [];
            for (let i = 0; i < parts.length; i += 2) {
                const phrase = parts[i].trim();
                const punct = parts[i + 1];
                if (phrase || punct) {
                    segments.push({
                        phrase,
                        punctWord: PUNCTUATION_MAP[punct] || null,
                        rawPunct: punct
                    });
                }
            }
            return segments;
        };

        const calculateSentencePause = (text, setting) => {
            if (setting === 'auto') {
                const words = (text || '').trim().split(/\s+/).filter(Boolean).length;
                return Math.max(3, Math.ceil(words * 1.4 + 2));
            }
            return Number(setting) || 5;
        };

        const diffWords = (original, userInput) => {
            const cleanWord = (w) => w.toLowerCase().replace(/[^a-z0-9]/g, '');
            const origWords = original.split(/\s+/).filter(Boolean);
            const userWords = userInput.split(/\s+/).filter(Boolean);
            
            let result = [];
            let uIdx = 0;

            for (let i = 0; i < origWords.length; i++) {
                const oWord = origWords[i];
                const cleanO = cleanWord(oWord);
                
                let foundMatch = false;
                let tempUIdx = uIdx;
                
                while (tempUIdx < userWords.length && tempUIdx < uIdx + 3) {
                    if (cleanO === cleanWord(userWords[tempUIdx])) {
                        foundMatch = true;
                        break;
                    }
                    tempUIdx++;
                }

                if (foundMatch) {
                    while (uIdx < tempUIdx) {
                        result.push({ text: userWords[uIdx], status: 'wrong' });
                        uIdx++;
                    }
                    result.push({ text: oWord, status: 'correct' });
                    uIdx++;
                } else {
                    result.push({ text: oWord, status: 'missing' });
                }
            }
            
            while (uIdx < userWords.length) {
                result.push({ text: userWords[uIdx], status: 'wrong' });
                uIdx++;
            }
            return result;
        };

        const App = () => {
            const [passages, setPassages] = useState(() => {
                try {
                    const saved = localStorage.getItem('edm_passages_v2_2');
                    return saved ? JSON.parse(saved) : DEFAULT_PASSAGES;
                } catch (e) {
                    return DEFAULT_PASSAGES;
                }
            });

            const [userInputs, setUserInputs] = useState(() => {
                try {
                    const saved = localStorage.getItem('edm_user_inputs_v2_2');
                    return saved ? JSON.parse(saved) : {};
                } catch (e) {
                    return {};
                }
            });

            const [activeId, setActiveId] = useState(() => {
                try {
                    const saved = localStorage.getItem('edm_active_id_v2_2');
                    return saved || passages[0]?.id || null;
                } catch (e) {
                    return passages[0]?.id || null;
                }
            });

            // Default values according to specification:
            // pause: auto, loops: 2x, speed: 0.6x, voice: UK Female, Punctuation: on (true)
            const [isDarkMode, setIsDarkMode] = useState(() => {
                try { return JSON.parse(localStorage.getItem('edm_dark_mode_v1_8') || 'false'); } catch (e) { return false; }
            });
            const [isBlurMode, setIsBlurMode] = useState(() => {
                try { return JSON.parse(localStorage.getItem('edm_blur_mode_v1_8') || 'false'); } catch (e) { return false; }
            });
            
            // Punctuation is permanently set to On (true) by default
            const speakPunctuation = true;

            const [loopCount, setLoopCount] = useState(() => {
                try { return Number(localStorage.getItem('edm_loop_count_v1_8')) || 2; } catch (e) { return 2; }
            });
            const [pauseDuration, setPauseDuration] = useState(() => {
                try { return localStorage.getItem('edm_pause_duration_v2_0') || 'auto'; } catch (e) { return 'auto'; }
            });
            const [speechRate, setSpeechRate] = useState(() => {
                try {
                    const saved = localStorage.getItem('edm_speech_rate_v2_0');
                    return saved !== null ? Number(saved) : 0.8;
                } catch (e) { return 0.8; }
            });
            const [wordPause, setWordPause] = useState(() => {
                try {
                    const saved = localStorage.getItem('edm_word_pause_v2_0');
                    return saved !== null ? Number(saved) : 1;
                } catch (e) { return 1; }
            });
            const [selectedVoiceGender, setSelectedVoiceGender] = useState(() => {
                try { return localStorage.getItem('edm_voice_gender_v2_0') || 'uk-female'; } catch (e) { return 'uk-female'; }
            });

            const [isSidebarOpen, setIsSidebarOpen] = useState(false);

            const [voices, setVoices] = useState([]);
            const [playingSentenceId, setPlayingSentenceId] = useState(null);
            const [activeSentenceIndex, setActiveSentenceIndex] = useState(null);
            const [countdown, setCountdown] = useState(null);
            const [editingSentenceIds, setEditingSentenceIds] = useState({});
            const [gradingResults, setGradingResults] = useState({});
            const [showNewModal, setShowNewModal] = useState(false);
            const [newTitle, setNewTitle] = useState('');
            const [newContent, setNewContent] = useState('');
            const [showImportExport, setShowImportExport] = useState(false);
            const [deleteModalId, setDeleteModalId] = useState(null);

            const isPlayingRef = useRef(false);
            const [isPlayingAll, setIsPlayingAll] = useState(false);
            const [isPlayingFullPassage, setIsPlayingFullPassage] = useState(false);
            const [saveStatus, setSaveStatus] = useState('saved');
            const [lastSavedTime, setLastSavedTime] = useState(() => new Date().toLocaleTimeString());

            useEffect(() => {
                const loadVoices = () => {
                    if (window.speechSynthesis) {
                        setVoices(window.speechSynthesis.getVoices());
                    }
                };
                loadVoices();
                if (window.speechSynthesis) {
                    window.speechSynthesis.onvoiceschanged = loadVoices;
                }
            }, []);

            useEffect(() => {
                try {
                    setSaveStatus('saving');
                    localStorage.setItem('edm_passages_v2_2', JSON.stringify(passages));
                    const now = new Date().toLocaleTimeString();
                    const timer = setTimeout(() => {
                        setSaveStatus('saved');
                        setLastSavedTime(now);
                    }, 200);
                    return () => clearTimeout(timer);
                } catch (e) {
                    console.error("Auto-save error:", e);
                }
            }, [passages]);

            useEffect(() => {
                try {
                    setSaveStatus('saving');
                    localStorage.setItem('edm_user_inputs_v2_2', JSON.stringify(userInputs));
                    const now = new Date().toLocaleTimeString();
                    const timer = setTimeout(() => {
                        setSaveStatus('saved');
                        setLastSavedTime(now);
                    }, 200);
                    return () => clearTimeout(timer);
                } catch (e) {
                    console.error("Auto-save user input error:", e);
                }
            }, [userInputs]);

            useEffect(() => {
                try {
                    if (activeId) localStorage.setItem('edm_active_id_v2_0', activeId);
                    localStorage.setItem('edm_dark_mode_v2_0', JSON.stringify(isDarkMode));
                    localStorage.setItem('edm_blur_mode_v2_0', JSON.stringify(isBlurMode));
                    localStorage.setItem('edm_loop_count_v2_0', String(loopCount));
                    localStorage.setItem('edm_pause_duration_v2_0', String(pauseDuration));
                    localStorage.setItem('edm_speech_rate_v2_0', String(speechRate));
                    localStorage.setItem('edm_word_pause_v2_0', String(wordPause));
                    localStorage.setItem('edm_voice_gender_v2_0', selectedVoiceGender);
                } catch (e) {
                    console.error("Settings save error:", e);
                }
            }, [activeId, isDarkMode, isBlurMode, loopCount, pauseDuration, speechRate, wordPause, selectedVoiceGender]);
            useEffect(() => {
                if (isDarkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [isDarkMode]);

            const activePassage = passages.find(p => p.id === activeId);
            const delay = (ms) => new Promise(res => setTimeout(res, ms));

            const getSelectedVoice = () => {
                const available = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
                if (!available || available.length === 0) return null;

                const ukVoices = available.filter(v => v.lang && v.lang.replace('_', '-').toLowerCase().startsWith('en-gb'));
                const candidates = ukVoices.length > 0 ? ukVoices : available.filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));

                if (selectedVoiceGender === 'uk-female') {
                    const female = candidates.find(v => {
                        const n = (v.name || '').toLowerCase();
                        return n.includes('female') || n.includes('hazel') || n.includes('sonia') || n.includes('serena') || n.includes('kate') || n.includes('martha') || n.includes('victoria') || n.includes('susan') || n.includes('fiona') || n.includes('libby');
                    });
                    if (female) return female;
                } else if (selectedVoiceGender === 'uk-male') {
                    const male = candidates.find(v => {
                        const n = (v.name || '').toLowerCase();
                        return n.includes('male') || n.includes('george') || n.includes('ryan') || n.includes('daniel') || n.includes('oliver') || n.includes('arthur') || n.includes('thomas');
                    });
                    if (male) return male;
                }

                const specificVoice = available.find(v => v.voiceURI === selectedVoiceGender || v.name === selectedVoiceGender);
                if (specificVoice) return specificVoice;

                return candidates[0] || available[0] || null;
            };

            const speakText = async (text, voice) => {
                return new Promise((resolve) => {
                    if (!text || !text.trim() || !isPlayingRef.current) {
                        resolve();
                        return;
                    }

                    if (window.speechSynthesis && window.speechSynthesis.paused) {
                        window.speechSynthesis.resume();
                    }

                    const utterance = new SpeechSynthesisUtterance(text);
                    if (voice) utterance.voice = voice;
                    utterance.rate = speechRate;

                    utterance.onend = () => resolve();
                    utterance.onerror = (e) => {
                        // "interrupted" or "canceled" are standard events when stopping speech
                        if (e.error !== 'interrupted' && e.error !== 'canceled') {
                            console.warn("Speech synthesis note:", e.error || 'Playback stopped');
                        }
                        resolve();
                    };

                    try {
                        window.speechSynthesis.speak(utterance);
                    } catch (err) {
                        console.warn("Speech synthesis speak call error:", err);
                        resolve();
                    }
                });
            };

            const playSingleSentence = async (sentence, loops, pauseSetting) => {
                setPlayingSentenceId(sentence.id);
                setCountdown(null);

                const voice = getSelectedVoice();
                const actualPauseTime = calculateSentencePause(sentence.text, pauseSetting);

                try {
                    for (let loop = 0; loop < loops; loop++) {
                        if (!isPlayingRef.current) break;

                        if (wordPause > 0) {
                            const tokens = tokenizeWords(sentence.text, speakPunctuation);
                            for (let k = 0; k < tokens.length; k++) {
                                if (!isPlayingRef.current) break;
                                await speakText(tokens[k].text, voice);
                                if (!isPlayingRef.current) break;
                                if (k < tokens.length - 1) {
                                    await delay(wordPause * 1000);
                                }
                            }
                        } else {
                            const segments = parseTextForSpeech(sentence.text, speakPunctuation);
                            for (const seg of segments) {
                                if (!isPlayingRef.current) break;
                                if (seg.phrase) {
                                    await speakText(seg.phrase, voice);
                                }
                                if (!isPlayingRef.current) break;
                                if (seg.punctWord) {
                                    await speakText(seg.punctWord, voice);
                                    if (!isPlayingRef.current) break;
                                    await delay(800);
                                }
                            }
                        }

                        if (!isPlayingRef.current) break;

                        if (loop < loops - 1) {
                            let remainingTime = actualPauseTime;
                            while (remainingTime > 0 && isPlayingRef.current) {
                                setCountdown(remainingTime);
                                await delay(1000);
                                remainingTime--;
                            }
                            setCountdown(null);
                        }
                    }
                } catch (e) {
                    console.warn("Playback interrupted or stopped.");
                }
            };

            const playDictation = async (sentence, loops = loopCount) => {
                if (isPlayingRef.current) stopDictation();
                isPlayingRef.current = true;
                setIsPlayingAll(false);
                
                await playSingleSentence(sentence, loops, pauseDuration);

                isPlayingRef.current = false;
                setPlayingSentenceId(null);
                setCountdown(null);
            };

            const playAllDictation = async () => {
                if (!activePassage || activePassage.sentences.length === 0) return;
                if (isPlayingRef.current) stopDictation();

                isPlayingRef.current = true;
                setIsPlayingAll(true);

                for (let i = 0; i < activePassage.sentences.length; i++) {
                    if (!isPlayingRef.current) break;
                    const sentence = activePassage.sentences[i];
                    setActiveSentenceIndex(i + 1);
                    
                    await playSingleSentence(sentence, loopCount, pauseDuration);

                    if (i < activePassage.sentences.length - 1 && isPlayingRef.current) {
                        let remaining = calculateSentencePause(sentence.text, pauseDuration);
                        while (remaining > 0 && isPlayingRef.current) {
                            setCountdown(remaining);
                            await delay(1000);
                            remaining--;
                        }
                        setCountdown(null);
                    }
                }

                isPlayingRef.current = false;
                setIsPlayingAll(false);
                setPlayingSentenceId(null);
                setActiveSentenceIndex(null);
                setCountdown(null);
            };

            const playFullPassage = async () => {
                if (!activePassage || activePassage.sentences.length === 0) return;
                if (isPlayingRef.current) stopDictation();

                isPlayingRef.current = true;
                setIsPlayingFullPassage(true);

                const voice = getSelectedVoice();

                try {
                    for (let i = 0; i < activePassage.sentences.length; i++) {
                        if (!isPlayingRef.current) break;
                        const sentence = activePassage.sentences[i];
                        setPlayingSentenceId(sentence.id);
                        setActiveSentenceIndex(i + 1);

                        if (wordPause > 0) {
                            const tokens = tokenizeWords(sentence.text, speakPunctuation);
                            for (let k = 0; k < tokens.length; k++) {
                                if (!isPlayingRef.current) break;
                                await speakText(tokens[k].text, voice);
                                if (!isPlayingRef.current) break;
                                if (k < tokens.length - 1) {
                                    await delay(wordPause * 1000);
                                }
                            }
                        } else {
                            const segments = parseTextForSpeech(sentence.text, speakPunctuation);
                            for (const seg of segments) {
                                if (!isPlayingRef.current) break;
                                if (seg.phrase) {
                                    await speakText(seg.phrase, voice);
                                }
                                if (!isPlayingRef.current) break;
                                if (seg.punctWord) {
                                    await speakText(seg.punctWord, voice);
                                    if (!isPlayingRef.current) break;
                                    await delay(800);
                                }
                            }
                        }

                        if (i < activePassage.sentences.length - 1 && isPlayingRef.current) {
                            await delay(2000);
                        }
                    }
                } catch (e) {
                    console.error("Full passage speech error:", e);
                }

                isPlayingRef.current = false;
                setIsPlayingFullPassage(false);
                setPlayingSentenceId(null);
                setActiveSentenceIndex(null);
            };

                setPassages(updated);
                setActiveId(newPassage.id);

                setNewContent('');
                setShowNewModal(false);

                setPassages(prev => prev.map(p => p.id === updatedPassage.id ? updatedPassage : p));
            };

                setEditingSentenceIds(prev => ({
                    ...prev,
                    [sentenceId]: !prev[sentenceId]

                if (!activePassage) return;
                const updatedSentences = activePassage.sentences.map(s => 
                    s.id === sentenceId ? { ...s, text: newText } : s
                );
                updatePassage({ ...activePassage, sentences: updatedSentences });
            };

            const handleInputChange = (sentenceId, value) => {
                setUserInputs(prev => ({ ...prev, [sentenceId]: value }));
                if (gradingResults[sentenceId]) {
                    setGradingResults(prev => {
                        const newRes = {...prev};
                        delete newRes[sentenceId];
                        return newRes;
                    });
                }
            };

                const current = userInputs[sentenceId] || '';
                handleInputChange(sentenceId, current + char);
            };

            const handleGrade = (sentence) => {
                const input = userInputs[sentence.id] || "";
                const diff = diffWords(sentence.text, input);
                setGradingResults(prev => ({ ...prev, [sentence.id]: diff }));
            };

            const handleGradeAll = () => {
                if (!activePassage) return;
                const newResults = {};

                document.body.appendChild(downloadAnchor);

                            else if (item.status === 'missing') { missingCount++; totalWords++; }

                                            <div><span className="block text-gray-300 text-[9px] md:text-[10px]">Total Words</span><span className="text-xs md:text-sm font-bold">{metrics.totalWords}</span></div>
                                            <div className="w-px bg-white/20"></div>
                                            <div><span className="block text-emerald-300 text-[9px] md:text-[10px]">Correct</span><span className="text-xs md:text-sm font-bold text-emerald-300">{metrics.correctCount}</span></div>
                                            <div className="w-px bg-white/20"></div>
                                            <div><span className="block text-amber-300 text-[9px] md:text-[10px]">Wrong</span><span className="text-xs md:text-sm font-bold text-amber-300">{metrics.wrongCount}</span></div>
                                            <div className="w-px bg-white/20"></div>
                                            <div><span className="block text-rose-300 text-[9px] md:text-[10px]">Missing</span><span className="text-xs md:text-sm font-bold text-rose-300">{metrics.missingCount}</span></div>
                                        </div>
                                    </div>
                                )}

                                {/* Sentences List Workspace */}
                                {}
                                <div className="flex-1 overflow-y-auto p-3 md:p-6 space-y-4 md:space-y-5">
                                    {activePassage.sentences.map((sentence, idx) => {
                                        const isPlaying = playingSentenceId === sentence.id;
                                        const diffResult = gradingResults[sentence.id];
                                        const computedPause = calculateSentencePause(sentence.text, pauseDuration);

                                        return (
                                            <div 
                                                key={sentence.id}
                                                className={`p-3.5 md:p-5 rounded-xl border transition-all duration-200 bg-white dark:bg-dark-800 shadow-sm ${
                                                    isPlaying ? 'ring-2 ring-indigo-500 border-indigo-300 dark:border-indigo-700' : 'border-gray-200 dark:border-gray-700'
                                                }`}
                                            >
                                                <div className="flex justify-between items-start mb-2 md:mb-3 gap-2 flex-wrap">
                                                    <div className="flex items-center gap-2">
                                                        <span className="text-xs font-bold text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-900/40 px-2.5 py-1 rounded-md">
                                                            Sentence {idx + 1}
                                                        </span>
                                                        <span className="text-[10px] md:text-[11px] font-medium text-gray-400 dark:text-gray-500 bg-gray-100 dark:bg-dark-700 px-2 py-0.5 rounded">
                                                            ⏱ {computedPause}s
                                                        </span>
                                                    </div>
                                                    <div className="flex items-center gap-1.5 ml-auto">
                                                        <button 
                                                            onClick={() => toggleEditSentence(sentence.id)}
                                                            className={`flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium transition-colors ${
                                                                editingSentenceIds[sentence.id] 
                                                                    ? 'bg-emerald-600 text-white hover:bg-emerald-700 shadow-sm' 
                                                                    : 'bg-gray-100 hover:bg-gray-200 dark:bg-dark-700 dark:hover:bg-dark-600 text-gray-700 dark:text-gray-300'
                                                            }`}
                                                            title={editingSentenceIds[sentence.id] ? "Done Editing" : "Edit Sentence"}
                                                        >
                                                            {editingSentenceIds[sentence.id] ? <CheckIcon size={14} /> : <EditIcon size={14} />}
                                                            <span className="hidden sm:inline">{editingSentenceIds[sentence.id] ? "Save" : "Edit"}</span>
                                                        </button>
                                                        {isPlaying ? (
                                                            <button onClick={stopDictation} className="flex items-center gap-1 bg-red-500 text-white px-2.5 py-1.5 rounded-lg text-xs font-medium hover:bg-red-600">
                                                                <SquareIcon size={14} /> Stop
                                                            </button>
                                                        ) : (
                                                            <button onClick={() => playDictation(sentence, loopCount)} className="flex items-center gap-1 bg-indigo-600 text-white px-2.5 py-1.5 rounded-lg text-xs font-medium hover:bg-indigo-700 shadow-sm">
                                                                <PlayIcon size={14} /> Listen
                                                            </button>
                                                        )}
                                                        <button onClick={() => deleteSentence(sentence.id)} className="p-1.5 text-gray-400 hover:text-red-500 rounded-lg hover:bg-gray-100 dark:hover:bg-dark-700" title="Delete">
                                                            <TrashIcon size={16} />
                                                        </button>
                                                    </div>
                                                </div>

                                                {/* Sentence Text / Edit Mode */}
                                                <div className="mb-3 md:mb-4 relative">
                                                    {editingSentenceIds[sentence.id] ? (
                                                        <div className="space-y-1">
                                                            <textarea 
                                                                value={sentence.text}
                                                                onChange={(e) => handleTextEdit(sentence.id, e.target.value)}
                                                                placeholder="Enter sentence text..."
                                                                className="w-full p-2.5 text-base font-medium bg-gray-50 dark:bg-dark-700 border border-indigo-400 dark:border-indigo-500 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none resize-y"
                                                                rows={2}
                                                                autoFocus
                                                            />
                                                            <div className="flex justify-between items-center text-[10px] text-gray-400">
                                                                <span className="italic">Auto-saves as you type</span>
                                                                <button onClick={() => toggleEditSentence(sentence.id)} className="text-xs text-indigo-600 dark:text-indigo-400 font-semibold hover:underline">
                                                                    Done
                                                                </button>
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        <div 
                                                            onClick={() => toggleEditSentence(sentence.id)}
                                                            className={`text-base md:text-lg font-medium py-1.5 px-1 rounded-lg hover:bg-gray-50 dark:hover:bg-dark-700/50 cursor-pointer border-b border-dashed border-gray-200 dark:border-gray-700 transition-colors ${isBlurMode ? 'blur-text' : ''}`}
                                                            title="Click to edit sentence text"
                                                        >
                                                            {sentence.text || <span className="text-gray-400 italic">Click Edit to modify...</span>}
                                                        </div>
                                                    )}
                                                </div>

                                                {/* Dictation Input */}
                                                <div className="space-y-2 pt-1">
                                                    <textarea 
                                                        value={userInputs[sentence.id] || ''}
                                                        onChange={(e) => handleInputChange(sentence.id, e.target.value)}
                                                        placeholder="Type what you hear..."
                                                        className="w-full p-2.5 md:p-3 text-sm bg-gray-50 dark:bg-dark-700 border border-gray-200 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                                        rows={2}
                                                    />

                                                    <div className="flex items-center justify-end pt-1">
                                                        <button 
                                                            onClick={() => handleGrade(sentence)}
                                                            className="text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:underline flex items-center gap-1"
                                                        >
                                                            <CheckIcon size={13}/> Check Sentence
                                                        </button>
                                                    </div>

                                                    {isPlaying && countdown !== null && (
                                                        <div className="mt-2 text-xs font-bold text-amber-600 dark:text-amber-400 animate-pulse bg-amber-50 dark:bg-amber-900/30 px-3 py-1.5 rounded-md border border-amber-200 dark:border-amber-800 inline-block">
                                                            Pause for typing: {countdown}s ({pauseDuration === 'auto' ? 'Auto length' : 'Fixed pause'})
                                                        </div>
                                                    )}

                                                    {/* Sentence Diff Grading Result */}
                                                    {diffResult && (
                                                        <div className="mt-3 p-3 bg-gray-100 dark:bg-dark-700/80 rounded-lg text-xs md:text-sm flex flex-wrap gap-1.5 leading-relaxed border border-gray-200 dark:border-gray-600">
                                                            {diffResult.map((w, wIdx) => {
                                                                if (w.status === 'correct') return <span key={wIdx} className="diff-correct">{w.text}</span>;
                                                                if (w.status === 'missing') return <span key={wIdx} className="diff-missing">{w.text}</span>;
                                                                return <span key={wIdx} className="diff-wrong">{w.text}</span>;
                                                            })}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    })}

                                    <button 
                                        onClick={addNewSentence}
                                        className="w-full py-3 border-2 border-dashed border-gray-300 dark:border-gray-700 text-gray-500 hover:text-indigo-600 hover:border-indigo-400 rounded-xl font-semibold text-sm transition-colors flex items-center justify-center gap-2"
                                    >
                                        <PlusIcon size={16}/> Add Sentence
                                    </button>
                                </div>
                            </>
                        ) : (
                            <div className="flex-1 flex flex-col items-center justify-center text-gray-400 p-8">
                                <p className="mb-4 text-lg">No passages available.</p>
                                <button onClick={() => setShowNewModal(true)} className="bg-indigo-600 text-white px-4 py-2 rounded-lg font-medium">
                                    Create First Passage
                                </button>
                            </div>
                        )}
                    </div>

                    {/* Modal: New Passage */}
                    {showNewModal && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
                            <div className="bg-white dark:bg-dark-800 rounded-2xl p-6 max-w-lg w-full shadow-2xl border border-gray-200 dark:border-gray-700">
                                <h3 className="text-xl font-bold mb-4 text-gray-900 dark:text-white">Add New Passage</h3>
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">Title</label>
                                        <input 
                                            value={newTitle}
                                            onChange={(e) => setNewTitle(e.target.value)}
                                            placeholder="e.g. Chapter 1 Dictation"
                                            className="w-full p-2.5 bg-gray-50 dark:bg-dark-700 border border-gray-200 dark:border-gray-600 rounded-lg text-sm outline-none focus:border-indigo-500"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">English Passage Text</label>
                                        <textarea 
                                            value={newContent}
                                            onChange={(e) => setNewContent(e.target.value)}
                                            placeholder="Paste full passage text here..."
                                            rows={6}
                                            className="w-full p-2.5 bg-gray-50 dark:bg-dark-700 border border-gray-200 dark:border-gray-600 rounded-lg text-sm outline-none focus:border-indigo-500 resize-none"
                                        />
                                        <p className="text-xs text-gray-400 mt-1">Text will automatically split into individual dictation sentence cards.</p>
                                    </div>
                                </div>
                                <div className="flex justify-end gap-3 mt-6">
                                    <button onClick={() => setShowNewModal(false)} className="px-4 py-2 text-sm font-medium text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-dark-700 rounded-lg">Cancel</button>
                                    <button onClick={handleCreatePassage} className="px-4 py-2 text-sm font-medium bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 shadow-sm">Save Passage</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal: Backup & Restore */}
                    {showImportExport && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
                            <div className="bg-white dark:bg-dark-800 rounded-2xl p-6 max-w-md w-full shadow-2xl border border-gray-200 dark:border-gray-700">
                                <h3 className="text-lg font-bold mb-2 text-gray-900 dark:text-white flex items-center gap-2">
                                    <DownloadIcon size={18}/> Backup & Restore Passages
                                </h3>
                                <p className="text-xs text-gray-500 dark:text-gray-400 mb-6">
                                    Export your custom passages to share with students, or restore from a JSON backup file.
                                </p>
                                <div className="space-y-3">
                                    <button 
                                        onClick={exportPassagesJSON}
                                        className="w-full flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white p-3 rounded-xl font-semibold text-sm transition-colors shadow-sm"
                                    >
                                        <DownloadIcon size={16}/> Export Passages (.json)
                                    </button>
                                    
                                    <label className="w-full flex items-center justify-center gap-2 bg-gray-100 hover:bg-gray-200 dark:bg-dark-700 dark:hover:bg-dark-600 text-gray-800 dark:text-gray-200 p-3 rounded-xl font-semibold text-sm transition-colors cursor-pointer border border-gray-200 dark:border-gray-600">
                                        <UploadIcon size={16}/> Import Passages (.json)
                                        <input type="file" accept=".json" onChange={importPassagesJSON} className="hidden" />
                                    </label>
                                </div>
                                <div className="mt-6 text-right">
                                    <button onClick={() => setShowImportExport(false)} className="px-4 py-2 text-sm font-medium text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-dark-700 rounded-lg">
                                        Close
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal: Confirm Delete */}
                    {deleteModalId && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
                            <div className="bg-white dark:bg-dark-800 rounded-2xl p-6 max-w-sm w-full shadow-2xl border border-gray-200 dark:border-gray-700 text-center">
                                <h3 className="text-lg font-bold mb-2 text-gray-900 dark:text-white">Delete Passage?</h3>
                                <p className="text-sm text-gray-500 dark:text-gray-400 mb-6">Are you sure you want to permanently remove this passage and its contents?</p>
                                <div className="flex justify-center gap-3">
                                    <button onClick={() => setDeleteModalId(null)} className="px-4 py-2 text-sm font-medium bg-gray-100 dark:bg-dark-700 text-gray-700 dark:text-gray-300 rounded-lg">Cancel</button>
                                    <button onClick={confirmDeletePassage} className="px-4 py-2 text-sm font-medium bg-red-600 text-white rounded-lg hover:bg-red-700 shadow-sm">Delete</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
